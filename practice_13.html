<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tasks – Box · Headings · Buttons</title>
  
  <!-- Q3 – green background using EXTERNAL stylesheet -->
  <link rel="stylesheet" href="data:text/css,.btn-green%20%7B%20background-color%3A%20green%3B%20color%3A%20white%3B%20border%3A%20none%3B%20padding%3A%208px%2016px%3B%20border-radius%3A%208px%3B%20cursor%3A%20pointer%3B%20%7D">
  
  <!-- Q2 + Q3 (blue via style tag) + Q1 styles -->
  <style>
    /* Q1 – blue box */
    #box {
      background-color: blue;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
      border-radius: 12px;
    }
    
    /* Q2 – all headings with class "heading" become red */
    .heading {
      color: red;
    }
    
    /* Q3 – blue button using internal <style> tag */
    .btn-blue {
      background-color: blue;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    
    /* just for layout */
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    hr {
      margin: 2rem 0;
    }
  </style>
</head>
<body>

  <!-- Q1 -->
  <div id="box">
    Hello! I'm the blue box with some text content.
  </div>

  <!-- Q2 -->
  <h1 class="heading">Heading 1 (h1) – red</h1>
  <h2 class="heading">Heading 2 (h2) – red</h2>
  <h3 class="heading">Heading 3 (h3) – red</h3>

  <!-- Q3 – three buttons, each with a different background method -->
  <hr>
  <h3>Three buttons – three CSS methods:</h3>
  <div class="btn-group">
    <!-- green via external stylesheet -->
    <button class="btn-green">Green (external CSS)</button>
    
    <!-- blue via <style> tag -->
    <button class="btn-blue">Blue (style tag)</button>
    
    <!-- pink via inline style -->
    <button style="background-color: pink; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Pink (inline style)</button>
  </div>

</body>
</html>
